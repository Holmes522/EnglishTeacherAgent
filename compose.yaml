name: english-teacher-agent
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: english_teacher
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: english_teacher
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_teacher -d english_teacher"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
